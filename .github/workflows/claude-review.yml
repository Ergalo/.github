# Revue automatique d'une pull request par Claude (optionnelle).
# Utilise la clé API du dépôt où il tourne (secret ANTHROPIC_API_KEY).
# Utilisation :
#   on: pull_request
#   jobs:
#     revue:
#       uses: Ergalo/.github/.github/workflows/claude-review.yml@v2
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
name: Revue Claude

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  revue:
    runs-on: ubuntu-latest
    # Droits limités au job qui en a besoin (commentaires sur la PR, jeton OIDC de l'action).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Relis cette pull request en français, pour un dirigeant qui ne code pas.
            Signale en priorité : bugs, failles de sécurité, secrets ou données réelles
            dans le code, tests manquants sur la logique métier, et tout ce qui sort
            du périmètre annoncé. Termine par un verdict clair : « OK pour fusionner »
            ou « À corriger avant fusion », avec la liste des points.
